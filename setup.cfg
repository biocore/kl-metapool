[metadata]
name = metapool
# Versioneer exposes a callable; setuptools reads it via "attr:"
version = attr: metapool._version.get_versions()["version"]

[versioneer]
VCS = git
style = pep440
versionfile_source = metapool/_version.py
versionfile_build = metapool/_version.py
tag_prefix =
parentdir_prefix = metapool-
