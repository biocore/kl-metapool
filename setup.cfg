[metadata]
name = metapool
version = attr: metapool.__version__

[versioneer]
VCS = git
style = pep440
versionfile_source = metapool/_version.py
versionfile_build = metapool/_version.py
tag_prefix =
parentdir_prefix = metapool-

[options]
packages = find:
include_package_data = True
# (keep your existing versioneer 'version = attr: ...' in [metadata])

[options.packages.find]
include =
    metapool*
exclude =
    notebooks*
    tests*
    docs*
